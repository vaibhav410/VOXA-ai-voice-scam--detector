<body>
<a class="skip-link" href="#view">Skip to workspace content</a>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a href="#/dashboard" class="logo" aria-label="VOXA home">
        <svg width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round"><path d="M1 10h3M5 6v8M8 3v14M11 7v6M14 1v18M17 6v8M20 4v12M23 8v4M26 10h1"/></svg>
        <span>VOXA</span>
      </a>
      <button class="icon-btn" id="collapse" aria-label="Collapse sidebar">«</button>
    </div>
    <div id="side-body"></div>
    <div class="side-foot">
      <div class="menu" id="menu" hidden>
        <div class="menu-head"><div class="avatar" id="m-av"></div><div><b id="m-name"></b><small id="m-mail"></small></div></div>
        <div class="mono" style="padding:8px 16px;color:var(--green)">ACCOUNT</div>
        <a href="#/profile">Workspace details</a>
        <a href="#/settings">Settings &amp; services</a>
        <hr>
        <a href="index.html#how" target="_blank" rel="noopener">How it works ↗</a>
        <a href="index.html#evaluation" target="_blank" rel="noopener">Evaluation &amp; limitations ↗</a>
        <a href="index.html#privacy" target="_blank" rel="noopener">Privacy &amp; data ↗</a>
        <hr>
        <button id="logout">Close workspace</button>
      </div>
      <button class="user" id="user-btn" aria-haspopup="true" aria-expanded="false">
        <div class="avatar" id="u-av"></div>
        <div class="who"><b id="u-name"></b><small id="u-mail"></small></div>
        <span>⌃</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">Menu</button>
      <nav class="tabs" id="tabs"></nav>
      <label class="sector"><span class="mono">Sector</span>
        <select id="sector" aria-label="Active sector"></select></label>
      <label class="top-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="top-q" type="search" placeholder="Search…" aria-label="Search saved reports" autocomplete="off"><kbd>Ctrl K</kbd></label>
      <button class="top-icon" id="fs" type="button" aria-label="Toggle full screen" title="Full screen"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <a class="top-icon" id="bell" href="#/call-safety" aria-label="High-risk alerts" title="High-risk alerts"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><b id="bell-n" hidden>0</b></a>
      <a class="account" href="#/profile" id="acct"><span id="acct-mail"></span> ⌄</a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>try{if(!localStorage.getItem('voxa:session'))location.replace('login.html?next='+encodeURIComponent(location.hash.split('/')[1]||'dashboard'))}catch{location.replace('login.html?next='+encodeURIComponent(location.hash.split('/')[1]||'dashboard'))}</script>
<script src="js/auth.js"></script>
<script>VoxaAuth.ready.then(s=>{if(s.mode==='clerk'&&!VoxaAuth.signedIn()){try{localStorage.removeItem('voxa:session')}catch{}location.replace('login.html?next='+encodeURIComponent(location.hash.replace(/^#\//,'')||'dashboard'));}}).catch(()=>{});</script>
